# Builds the GPU worker image in GitHub's cloud and pushes it to GHCR, so nobody needs Docker locally.
# Result: ghcr.io/<owner>/llm-worker:cuda  (and :cpu)
#
# One-time step after the first successful run: GitHub -> your profile/org -> Packages -> llm-worker
# -> Package settings -> Change visibility -> Public, so RunPod/Modal can pull it without credentials.
name: Build worker image

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/build-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cuda, cpu]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the owner (GHCR requires lowercase image names)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/llm-worker" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: worker
          file: worker/Dockerfile.${{ matrix.variant }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ matrix.variant }}
            ${{ steps.img.outputs.name }}:${{ matrix.variant }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
