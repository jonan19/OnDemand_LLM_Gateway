<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Personal LLM</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #272b35;
    --text: #e6e8ec;
    --muted: #8a8f99;
    --accent: #4f8cff;
    --user-bubble: #22304a;
    --assistant-bubble: #1e2129;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header span.status {
    font-weight: 400;
    font-size: 13px;
    color: var(--muted);
  }
  #layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #sidebar {
    width: 260px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #new-chat {
    margin: 12px;
    padding: 10px 0;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  #new-chat:hover { border-color: var(--accent); }
  #conv-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 12px;
  }
  .conv {
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
  }
  .conv:hover { background: var(--assistant-bubble); }
  .conv.active { background: var(--user-bubble); }
  .conv .title {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conv .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #conv-empty { color: var(--muted); font-size: 13px; padding: 10px; }
  #chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  #toggle-sidebar {
    display: none;
    background: transparent;
    border: 1px solid var(--border);
    padding: 4px 10px;
    margin-right: 10px;
  }
  @media (max-width: 700px) {
    #toggle-sidebar { display: inline-block; }
    #sidebar { display: none; position: absolute; top: 53px; bottom: 0; left: 0; z-index: 5; }
    #sidebar.open { display: flex; }
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.45;
    max-width: 80%;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user {
    align-self: flex-end;
    background: var(--user-bubble);
  }
  .assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
  }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>
    <div><button id="toggle-sidebar" type="button">&#9776;</button>Personal LLM Gateway</div>
    <span class="status" id="status">checking…</span>
  </header>
  <div id="layout">
    <aside id="sidebar">
      <button id="new-chat" type="button">+ New chat</button>
      <div id="conv-list"></div>
    </aside>
    <div id="chat">
      <div id="messages"></div>
      <form id="form">
        <textarea id="input" rows="1" placeholder="Send a message…"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </div>
  </div>

<script>
const messagesEl = document.getElementById('messages');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');

let conversationId = localStorage.getItem('conversation_id');

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function checkHealth() {
  try {
    const r = await fetch('/health');
    const j = await r.json();
    statusEl.textContent = j.worker && j.worker.status === 'ok' ? 'worker ready' : 'worker unreachable';
  } catch {
    statusEl.textContent = 'gateway unreachable';
  }
}
checkHealth();

const listEl = document.getElementById('conv-list');
const sidebarEl = document.getElementById('sidebar');
let streaming = false;

function setConversation(id) {
  conversationId = id ? String(id) : null;
  if (conversationId) localStorage.setItem('conversation_id', conversationId);
  else localStorage.removeItem('conversation_id');
}

async function loadHistory() {
  messagesEl.textContent = '';
  if (!conversationId) return;
  try {
    const r = await fetch('/conversations/' + conversationId);
    if (r.status === 404) { setConversation(null); return; }
    if (!r.ok) return;
    const j = await r.json();
    for (const m of j.messages) {
      if (m.role === 'user' || m.role === 'assistant') addMessage(m.role, m.content);
    }
  } catch {}
}

function formatWhen(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function refreshConversations() {
  try {
    const r = await fetch('/conversations');
    if (!r.ok) return;
    const { conversations } = await r.json();
    // Empty conversations (no messages) are hidden; a new chat is only created on first send.
    const shown = conversations.filter((c) => c.message_count > 0);
    listEl.textContent = '';
    if (!shown.length) {
      const empty = document.createElement('div');
      empty.id = 'conv-empty';
      empty.textContent = 'No conversations yet';
      listEl.appendChild(empty);
      return;
    }
    for (const c of shown) {
      const item = document.createElement('div');
      item.className = 'conv' + (String(c.id) === conversationId ? ' active' : '');
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = c.preview || '(no text)';
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = formatWhen(c.last_message_at) + ' · ' + c.message_count + ' msgs';
      item.append(title, meta);
      item.addEventListener('click', () => openConversation(c.id));
      listEl.appendChild(item);
    }
  } catch {}
}

async function openConversation(id) {
  if (streaming) return;
  setConversation(id);
  sidebarEl.classList.remove('open');
  await loadHistory();
  refreshConversations();
}

document.getElementById('new-chat').addEventListener('click', () => {
  if (streaming) return;
  setConversation(null);
  messagesEl.textContent = '';
  sidebarEl.classList.remove('open');
  refreshConversations();
  input.focus();
});

document.getElementById('toggle-sidebar').addEventListener('click', () => {
  sidebarEl.classList.toggle('open');
});

loadHistory().then(refreshConversations);

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  streaming = true;

  addMessage('user', text);
  const assistantDiv = addMessage('assistant', '');

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, conversation_id: conversationId ? Number(conversationId) : null }),
    });

    const newConvId = resp.headers.get('X-Conversation-Id');
    if (newConvId) {
      setConversation(newConvId);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6);
        if (raw === '[DONE]') continue;
        try {
          const chunk = JSON.parse(raw);
          const delta = chunk.choices?.[0]?.delta?.content;
          if (delta) {
            assistantDiv.textContent += delta;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        } catch {}
      }
    }
  } catch (err) {
    assistantDiv.textContent = '[error: ' + err.message + ']';
  } finally {
    streaming = false;
    sendBtn.disabled = false;
    input.focus();
    refreshConversations();
  }
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
